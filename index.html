<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="container">
        <div id="page-hero">
            <div id="header">
                <div id="header-container">
                    <img src="logo.png" alt="Odin-logo" width="70" height="90">ODIN</div>
            </div>
            <div id="footer"><span>Photo by <a href="https://unsplash.com/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie West</a> on <a href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></span></div>
        </div>
        <div id="form-side">
            <div id="form-hero">
                <p>This is not a real online service! You known you need something like this in your life to help you realize your deepest dreams.</p> 
                <p>Sign up <em>now</em>to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div id="form">
                <form id="sign-up-form">
                    <fieldset>
                        <legend>Let's do this</legend>
                        <div>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" placeholder="Thor" id="first-name" name="first-name"> 
                        </div>
                        <div>
                            <label for="last-name">LAST NAME</label>
                            <input type="text" placeholder="Odinson" id="last-name" name="last-name">
                        </div>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" placeholder="Thor" id="email" name="email">
                        </div>
                        <div>
                            <label for="phone-num">PHONE NUMBER</label>
                            <input type="tel" placeholder="1234567890" id="phone-num" name="phone-num" pattern="[0-9]{10}" >
                        </div>
                        <div>
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password">
                        </div>
                        <div>
                            <label for="re-password">CONFIRM PASSWORD</label>
                            <input type="password" id="re-password" name="re-password">
                        </div>
                    </fieldset>
                </form>
            </div>
            <div id="account-submit">
                <button type="submit" form="sign-up-form">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
    
</body>
</html>
